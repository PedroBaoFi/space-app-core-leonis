<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1d">
<title>Core Leonis — Health monitoring for astronauts (and the rest of us)</title>
<meta name="description" content="Core Leonis: science-based daily missions, health logs, radiation tracking and emergency decision trees for crews in orbit, on the Moon, Mars, deep space — and on Earth. NASA Space Apps 2026.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="view"></main>
  <nav id="nav">
    <div class="ind"></div>
    <button data-act="tab" data-id="today"><span>✦</span><small>Today</small></button>
    <button data-act="tab" data-id="body"><span>🧍</span><small>Body</small></button>
    <button data-act="tab" data-id="health"><span>❤️</span><small>Health</small></button>
    <button data-act="tab" data-id="sos"><span>🆘</span><small>SOS</small></button>
    <button data-act="tab" data-id="rad"><span>☢️</span><small>Radiation</small></button>
  </nav>
</div>
<div id="sheet">
  <div class="backdrop" data-act="close"></div>
  <div class="panel"><button class="x" data-act="close" aria-label="Close">✕</button><div id="sheetBody"></div></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="data/content.js"></script>
<script src="js/sound.js"></script>
<script src="js/app.js"></script>
</body>
</html>
